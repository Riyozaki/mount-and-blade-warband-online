<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Пеликан на велосипеде</title>
  <desc id="desc">Мультяшный белый пеликан с оранжевым клювом и красным шарфом едет на бирюзовом велосипеде по зелёному холму.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff2fb"/>
      <stop offset="1" stop-color="#f7fcff"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#ece1cd"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb352"/>
      <stop offset="1" stop-color="#ef8a13"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#f7ab45"/>
      <stop offset="1" stop-color="#e88311"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aad98b"/>
      <stop offset="1" stop-color="#8fc86f"/>
    </linearGradient>

    <clipPath id="pouchClip">
      <path d="M 446 96 C 510 100, 580 106, 650 110 C 668 112, 682 108, 694 100 C 690 128, 678 152, 656 168 C 620 196, 566 212, 520 202 C 470 191, 448 148, 446 96 Z"/>
    </clipPath>

    <g id="wheel">
      <circle r="86" fill="none" stroke="#2b3a42" stroke-width="13"/>
      <g stroke="#b9ccd3" stroke-width="3">
        <line x1="-72" y1="0" x2="72" y2="0"/>
        <line x1="-62.35" y1="-36" x2="62.35" y2="36"/>
        <line x1="-36" y1="-62.35" x2="36" y2="62.35"/>
        <line x1="0" y1="-72" x2="0" y2="72"/>
        <line x1="36" y1="-62.35" x2="-36" y2="62.35"/>
        <line x1="62.35" y1="-36" x2="-62.35" y2="36"/>
      </g>
      <circle r="70" fill="none" stroke="#a8bcc4" stroke-width="5"/>
      <circle r="9" fill="#2b3a42"/>
      <path d="M -60 -37 A 70 70 0 0 1 8 -69" fill="none" stroke="#dce9ed" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <circle cx="690" cy="92" r="54" fill="#ffe3a3"/>
  <circle cx="690" cy="92" r="74" fill="none" stroke="#ffe3a3" stroke-width="7" opacity="0.35"/>

  <g fill="#ffffff" opacity="0.92">
    <g>
      <circle cx="120" cy="122" r="26"/>
      <circle cx="152" cy="104" r="32"/>
      <circle cx="186" cy="118" r="24"/>
      <rect x="98" y="112" width="110" height="32" rx="16"/>
    </g>
    <g opacity="0.85">
      <circle cx="612" cy="196" r="18"/>
      <circle cx="636" cy="184" r="23"/>
      <circle cx="660" cy="194" r="16"/>
      <rect x="596" y="186" width="82" height="24" rx="12"/>
    </g>
  </g>

  <g fill="none" stroke="#8fc4d8" stroke-width="4" stroke-linecap="round">
    <path d="M 92 74 q 9 -8 18 0 q 9 -8 18 0"/>
    <path d="M 148 48 q 7 -6 14 0 q 7 -6 14 0" opacity="0.75"/>
  </g>

  <!-- hills -->
  <path d="M0 452 C 90 410, 190 446, 290 430 C 390 414, 470 440, 560 430 C 660 420, 730 438, 800 424 L800 600 L0 600 Z" fill="#d3ebbe"/>
  <path d="M0 500 C 140 486, 280 500, 420 494 C 560 488, 690 498, 800 492 L800 600 L0 600 Z" fill="url(#groundGrad)"/>

  <!-- grass tufts -->
  <g stroke="#6fb356" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 78 556 c 0 -12 4 -20 10 -26 M 88 556 c 2 -10 8 -16 16 -20"/>
    <path d="M 700 556 c 0 -12 4 -20 10 -26 M 710 556 c 2 -10 8 -16 16 -20"/>
    <path d="M 470 574 c 0 -10 3 -17 9 -22 M 479 574 c 2 -9 7 -14 14 -17"/>
  </g>

  <!-- shadow -->
  <ellipse cx="406" cy="520" rx="238" ry="16" fill="#6dae52" opacity="0.45"/>

  <!-- speed lines -->
  <g stroke="#7fb8cb" stroke-width="8" stroke-linecap="round" opacity="0.75">
    <path d="M 128 292 h -52"/>
    <path d="M 108 326 h -40"/>
    <path d="M 126 360 h -56"/>
  </g>

  <!-- dust puffs -->
  <g fill="#d3ebbe" opacity="0.9">
    <circle cx="150" cy="506" r="14"/>
    <circle cx="126" cy="494" r="9"/>
    <circle cx="168" cy="490" r="7"/>
  </g>

  <!-- ================= BIKE ================= -->
  <use href="#wheel" transform="translate(238 424)"/>
  <use href="#wheel" transform="translate(578 424)"/>

  <!-- far leg (behind frame) -->
  <path d="M 344 280 C 354 314, 364 344, 368 372 C 370 388, 368 398, 366 408" fill="none" stroke="#d18b41" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- far crank + pedal + far foot -->
  <line x1="400" y1="452" x2="364" y2="427" stroke="#7f8f95" stroke-width="8" stroke-linecap="round"/>
  <rect x="344" y="420" width="38" height="11" rx="5" fill="#2b3a42" transform="rotate(-8 363 426)"/>
  <path d="M 348 416 C 358 406, 380 408, 388 417 C 394 422, 393 427, 385 428 L 346 428 C 338 427, 340 421, 348 416 Z" fill="#d98a36"/>

  <!-- frame -->
  <g fill="none" stroke="#2f7d8c" stroke-width="14" stroke-linecap="round">
    <path d="M 400 452 L 238 424"/>
    <path d="M 400 452 L 326 302"/>
    <path d="M 238 424 L 326 302"/>
    <path d="M 326 302 L 521 297"/>
    <path d="M 400 452 L 540 336"/>
  </g>
  <path d="M 524 288 L 549 344" fill="none" stroke="#2f7d8c" stroke-width="17" stroke-linecap="round"/>
  <path d="M 549 344 C 561 372, 570 396, 578 424" fill="none" stroke="#2f7d8c" stroke-width="12" stroke-linecap="round"/>
  <!-- frame highlights -->
  <g fill="none" stroke="#4b9baa" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M 340 300 L 512 296"/>
    <path d="M 392 440 L 530 331"/>
  </g>

  <!-- seat post -->
  <path d="M 326 302 L 322 312" fill="none" stroke="#93a4aa" stroke-width="9" stroke-linecap="round"/>

  <!-- handlebar (raised cruiser style) -->
  <path d="M 524 288 L 518 246" fill="none" stroke="#8c9ba1" stroke-width="9" stroke-linecap="round"/>
  <path d="M 518 246 C 496 226, 468 226, 452 240" fill="none" stroke="#2b3a42" stroke-width="12" stroke-linecap="round"/>
  <path d="M 458 236 L 446 248" fill="none" stroke="#4a4038" stroke-width="16" stroke-linecap="round"/>
  <!-- bell -->
  <circle cx="536" cy="250" r="9" fill="#f6c85f"/>
  <circle cx="533" cy="247" r="3" fill="#fde3a1"/>

  <!-- saddle (behind the bird, so the belly sits over it) -->
  <path d="M 288 310 C 302 297, 332 293, 360 297 C 378 299, 384 307, 376 314 C 366 322, 326 324, 304 320 C 292 318, 282 314, 288 310 Z" fill="#4a4038"/>
  <path d="M 306 303 C 322 299, 342 299, 358 302" fill="none" stroke="#6b5e55" stroke-width="4" stroke-linecap="round"/>

  <!-- chain + chainring -->
  <path d="M 400 423.5 L 238 414 M 400 480.5 L 238 434" fill="none" stroke="#93a4aa" stroke-width="3.5" opacity="0.9"/>
  <circle cx="400" cy="452" r="32" fill="none" stroke="#b3c6cd" stroke-width="4" stroke-dasharray="4 5"/>
  <circle cx="400" cy="452" r="28" fill="none" stroke="#b3c6cd" stroke-width="6"/>
  <circle cx="400" cy="452" r="11" fill="#8c9ba1"/>

  <!-- ================= PELICAN ================= -->

  <!-- tail feathers -->
  <path d="M 266 232 C 240 240, 218 256, 212 276 C 234 274, 258 266, 276 252 Z" fill="#e9deca"/>
  <path d="M 272 258 C 250 270, 236 288, 234 306 C 254 298, 272 286, 286 270 Z" fill="#dfd2ba"/>

  <!-- body -->
  <path d="M 330 126 C 382 126, 414 170, 412 222 C 410 270, 378 298, 330 300 C 280 302, 252 266, 252 220 C 252 170, 278 126, 330 126 Z" fill="url(#bodyGrad)"/>
  <path d="M 262 250 C 286 290, 340 304, 384 286 C 366 300, 336 304, 310 300 C 282 294, 266 276, 262 250 Z" fill="#e9dec9" opacity="0.85"/>
  <path d="M 286 174 C 306 162, 334 164, 356 178" fill="none" stroke="#e3d7c2" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <g fill="none" stroke="#e6dac5" stroke-width="3.5" stroke-linecap="round" opacity="0.8">
    <path d="M 286 214 C 306 208, 328 210, 346 218"/>
    <path d="M 296 236 C 314 232, 332 234, 348 240"/>
  </g>

  <!-- neck -->
  <path d="M 352 188 C 346 146, 364 116, 404 106" fill="none" stroke="url(#bodyGrad)" stroke-width="46" stroke-linecap="round"/>
  <path d="M 378 160 C 380 140, 390 124, 404 116" fill="none" stroke="#eadfc9" stroke-width="12" stroke-linecap="round" opacity="0.55"/>

  <!-- scarf tails (behind the neck) -->
  <path d="M 378 148 C 348 130, 314 130, 288 140 C 310 152, 342 162, 372 164 Z" fill="#e2574a"/>
  <path d="M 376 156 C 348 156, 322 168, 298 170 C 320 180, 354 178, 378 168 Z" fill="#c94b3e"/>
  <path d="M 364 142 C 340 138, 320 140, 304 146" fill="none" stroke="#f07b6e" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- throat pouch -->
  <path d="M 446 96 C 510 100, 580 106, 650 110 C 668 112, 682 108, 694 100 C 690 128, 678 152, 656 168 C 620 196, 566 212, 520 202 C 470 191, 448 148, 446 96 Z" fill="url(#pouchGrad)"/>
  <g clip-path="url(#pouchClip)">
    <g fill="none" stroke="#c96c08" stroke-width="3" stroke-linecap="round" opacity="0.22">
      <path d="M 490 110 C 484 146, 500 176, 528 192"/>
      <path d="M 542 112 C 536 150, 550 180, 576 194"/>
      <path d="M 594 112 C 586 142, 590 164, 606 180"/>
      <path d="M 646 110 C 640 130, 640 146, 646 160"/>
    </g>
    <path d="M 466 104 C 494 140, 532 162, 572 172" fill="none" stroke="#ffc576" stroke-width="5" stroke-linecap="round" opacity="0.32"/>
  </g>

  <!-- head -->
  <circle cx="408" cy="98" r="45" fill="url(#bodyGrad)"/>
  <path d="M 376 72 C 390 60, 416 60, 434 70" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- upper mandible -->
  <path d="M 442 72 C 520 64, 616 80, 692 98 C 702 101, 704 108, 696 112 C 686 116, 668 120, 648 120 C 580 116, 500 108, 446 103 C 436 94, 434 80, 442 72 Z" fill="url(#beakGrad)"/>
  <path d="M 694 98 C 703 102, 704 109, 696 113 C 692 109, 691 104, 694 98 Z" fill="#d97a0c"/>
  <ellipse cx="478" cy="84" rx="5.5" ry="3" fill="#c96f0c" opacity="0.4"/>
  <path d="M 458 80 C 518 74, 584 84, 640 98" fill="none" stroke="#ffe1ab" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <!-- gape line: separates the mandible from the pouch -->
  <path d="M 446 100 C 520 106, 596 110, 656 110 C 676 110, 690 106, 698 100" fill="none" stroke="#b8630a" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- scarf band around the neck -->
  <path d="M 358 142 C 366 152, 380 160, 394 164" fill="none" stroke="#d64f42" stroke-width="19" stroke-linecap="round"/>
  <path d="M 366 144 C 372 152, 380 158, 390 161" fill="none" stroke="#ef7164" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- scarf knot -->
  <path d="M 362 152 C 378 144, 398 146, 410 154 C 402 168, 380 172, 360 166 Z" fill="#e2574a"/>
  <path d="M 374 149 C 384 147, 396 150, 402 155" fill="none" stroke="#f07b6e" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 366 151 C 374 147, 387 147, 395 151" fill="none" stroke="#b8433a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- eye -->
  <circle cx="404" cy="86" r="13" fill="#ffffff"/>
  <circle cx="407" cy="87" r="6.6" fill="#22333b"/>
  <circle cx="409.5" cy="84" r="2.5" fill="#ffffff"/>

  <!-- near wing reaching the handlebar -->
  <path d="M 318 186 C 344 174, 372 188, 396 206 C 418 222, 440 232, 456 232 C 470 232, 476 240, 470 246 C 464 252, 448 254, 434 250 C 408 242, 384 232, 360 220 C 342 211, 326 208, 316 202 C 310 196, 312 189, 318 186 Z" fill="#f1e8d7"/>
  <path d="M 432 230 C 448 231, 464 236, 470 244 C 474 250, 466 254, 456 251 C 445 247, 436 240, 432 230 Z" fill="#e2d4bd"/>
  <path d="M 462 242 C 466 246, 464 250, 459 250 C 455 249, 454 246, 456 243 C 458 241, 460 241, 462 242 Z" fill="#f6efe1"/>
  <g fill="none" stroke="#ddcdb4" stroke-width="4" stroke-linecap="round">
    <path d="M 344 216 C 364 222, 382 230, 396 236"/>
    <path d="M 366 226 C 382 232, 396 238, 406 242"/>
    <path d="M 392 236 C 404 242, 416 246, 426 248"/>
  </g>
  <path d="M 328 194 C 348 188, 366 196, 382 208" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

  <!-- near leg -->
  <path d="M 352 268 C 362 300, 372 330, 382 358 C 398 396, 414 430, 428 458" fill="none" stroke="#efa04c" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 344 276 C 352 262, 372 258, 384 266 C 392 272, 390 284, 380 292 C 368 300, 352 296, 344 288 Z" fill="#efa04c"/>
  <circle cx="382" cy="358" r="10" fill="#efa04c"/>
  <path d="M 356 280 C 366 276, 376 278, 382 284" fill="none" stroke="#ffbd74" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- near crank + pedal + foot -->
  <line x1="400" y1="452" x2="436" y2="477" stroke="#7f8f95" stroke-width="8" stroke-linecap="round"/>
  <rect x="418" y="472" width="38" height="11" rx="5" fill="#2b3a42"/>
  <path d="M 424 468 C 434 458, 456 460, 464 469 C 470 474, 470 479, 462 481 L 420 481 C 412 480, 414 474, 424 468 Z" fill="#f0a04b"/>
  <g stroke="#d98a36" stroke-width="2.5" stroke-linecap="round">
    <path d="M 438 470 L 434 480"/>
    <path d="M 450 470 L 450 480"/>
  </g>

  <!-- little motion accents -->
  <g stroke="#9ed0e0" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M 250 224 C 244 214, 244 206, 250 198"/>
  </g>
</svg>
